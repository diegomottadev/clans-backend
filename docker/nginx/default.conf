server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    # SecDevOps (OWASP A05): no revelar versión de nginx
    server_tokens off;

    # Cabeceras de seguridad (always = también en respuestas 4xx/5xx).
    # NOTA: no se tocan cabeceras CORS; las gestiona Laravel (config/cors.php).
    # Ojo: un add_header dentro de un location anula estas; por eso se repiten abajo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # SecDevOps: bloquear archivos ocultos (.env, .git, .htaccess...) salvo .well-known
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # SecDevOps: archivos de configuración/backup que nunca deben servirse
    location ~* \.(sql|dump|backup|bak|log|sh|ini|config|lock|md)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache de assets estaticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # SecDevOps: no revelar versión de PHP
        fastcgi_hide_header X-Powered-By;
    }
}
