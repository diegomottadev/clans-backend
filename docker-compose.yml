services:
  db:
    image: postgres:17
    container_name: clans_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - clans_pgdata:/var/lib/postgresql/data
      # Se ejecuta SOLO la primera vez (volumen vacio): restaura el backup
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - laravel

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clans-app
    container_name: clans_app
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www
      - app_storage:/var/www/storage
      - app_bootstrap_cache:/var/www/bootstrap/cache
    entrypoint: [ "sh", "/usr/local/bin/entrypoint.sh" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: clans_web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./:/var/www
      - app_storage:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    networks:
      - laravel

  frontend:
    build:
      context: ../clans-view
      dockerfile: Dockerfile
      args:
        REACT_APP_BASE_URL: http://localhost:8080
    image: clans-view
    container_name: clans_frontend
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "3000:80"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  clans_pgdata:
  app_storage:
  app_bootstrap_cache:
